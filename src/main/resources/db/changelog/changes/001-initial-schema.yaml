databaseChangeLog:
  - changeSet:
      id: 001-create-user-table
      author: developer
      changes:
        - createTable:
            tableName: user
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user
              - column:
                  name: first_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: varchar(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: goal
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: varchar(255)
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: phone_number
                  type: varchar(20)

  - changeSet:
      id: 001-create-user-interests-table
      author: developer
      changes:
        - createTable:
            tableName: user_interests
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_interests_user
                    references: user(id)
              - column:
                  name: interests
                  type: varchar(255)

  - changeSet:
      id: 001-create-user-skills-table
      author: developer
      changes:
        - createTable:
            tableName: user_skills
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_skills_user
                    references: user(id)
              - column:
                  name: skills
                  type: varchar(255)

  - changeSet:
      id: 001-create-roadmap-table
      author: developer
      changes:
        - createTable:
            tableName: roadmap
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roadmap
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: visibility
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_roadmap_user
                    references: user(id)
              - column:
                  name: created_date
                  type: timestamp
              - column:
                  name: last_modified_date
                  type: timestamp

  - changeSet:
      id: 001-create-milestone-table
      author: developer
      changes:
        - createTable:
            tableName: milestone
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_milestone
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: roadmap_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_milestone_roadmap
                    references: roadmap(id)
              - column:
                  name: progress_id
                  type: bigint
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-milestone-actionable-steps-table
      author: developer
      changes:
        - createTable:
            tableName: milestone_actionable_steps
            columns:
              - column:
                  name: milestone_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_milestone_actionable_steps
                    references: milestone(id)
              - column:
                  name: actionable_steps
                  type: varchar(500)

  - changeSet:
      id: 001-create-milestone-prerequisites-table
      author: developer
      changes:
        - createTable:
            tableName: milestone_prerequisites
            columns:
              - column:
                  name: milestone_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_milestone_prerequisites
                    references: milestone(id)
              - column:
                  name: prerequisites
                  type: varchar(500)

  - changeSet:
      id: 001-create-progress-table
      author: developer
      changes:
        - createTable:
            tableName: progress
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_progress
              - column:
                  name: status
                  type: varchar(20)
              - column:
                  name: completed_at
                  type: timestamp
              - column:
                  name: notes
                  type: text
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_progress_user
                    references: user(id)

  - changeSet:
      id: 001-create-resource-table
      author: developer
      changes:
        - createTable:
            tableName: resource
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_resource
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: milestone_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_resource_milestone
                    references: milestone(id)

  - changeSet:
      id: 001-create-indexes
      author: developer
      changes:
        - createIndex:
            indexName: idx_roadmap_user_id
            tableName: roadmap
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_roadmap_status
            tableName: roadmap
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_milestone_roadmap_id
            tableName: milestone
            columns:
              - column:
                  name: roadmap_id
        - createIndex:
            indexName: idx_milestone_status
            tableName: milestone
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_resource_milestone_id
            tableName: resource
            columns:
              - column:
                  name: milestone_id
