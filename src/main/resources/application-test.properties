spring.application.name=backendapi


spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:h2:mem:roadmapmaker-test;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.show-sql=false
spring.liquibase.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.ai.openai.chat.base-url=https://generativelanguage.googleapis.com
